<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>J.M. Mallari — Portfolio</title>
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=DM+Mono&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #080808;
            --surface: #121212;
            --accent: #C8F97D; /* Your signature green */
            --text: #EDEDE9;
            --muted: #888884;
            --border: rgba(255,255,255,0.08);
        }

        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            background: var(--bg); 
            color: var(--text); 
            font-family: 'DM Sans', sans-serif; 
            overflow-x: hidden;
            cursor: none; /* Custom cursor active */
        }

        /* --- Custom Cursor --- */
        .cursor { width: 10px; height: 10px; background: var(--accent); border-radius: 50%; position: fixed; pointer-events: none; z-index: 9999; }
        .cursor-ring { width: 36px; height: 36px; border: 1px solid rgba(200,249,125,0.4); border-radius: 50%; position: fixed; pointer-events: none; z-index: 9998; transition: all 0.15s ease-out; }

        /* --- Navigation --- */
        nav { position: fixed; top: 0; width: 100%; padding: 1.5rem 4rem; display: flex; justify-content: space-between; align-items: center; z-index: 100; background: rgba(8,8,8,0.8); backdrop-filter: blur(10px); }
        .logo { font-family: 'Syne', sans-serif; font-weight: 800; font-size: 1.2rem; }
        .logo span { color: var(--accent); }

        /* --- Hero Section --- */
        .hero { height: 100vh; display: flex; flex-direction: column; justify-content: center; padding: 0 4rem; }
        .hero-badge { color: var(--accent); font-family: 'DM Mono', monospace; font-size: 0.7rem; text-transform: uppercase; margin-bottom: 1rem; letter-spacing: 2px; }
        .hero-title { font-family: 'Syne', sans-serif; font-size: clamp(3rem, 8vw, 6rem); line-height: 0.9; margin-bottom: 2rem; }
        
        /* --- Stat Component (The Java Reference) --- */
        .stat-container { 
            border-top: 1px solid var(--border); 
            border-bottom: 1px solid var(--border); 
            padding: 2rem 0; 
            margin-top: 2rem;
            max-width: 600px;
        }
        .stat-label { font-family: 'DM Mono', monospace; color: var(--accent); font-size: 1.1rem; font-weight: bold; }

        footer { padding: 4rem; border-top: 1px solid var(--border); font-family: 'DM Mono', monospace; font-size: 0.7rem; color: var(--muted); text-align: center; }
    </style>
</head>
<body>

<div class="cursor" id="cursor"></div>
<div class="cursor-ring" id="cursorRing"></div>

<nav>
    <div class="logo">J<span>.</span>Mallari</div>
</nav>

<section class="hero">
    <div class="hero-badge">Available for Projects</div>
    <h1 class="hero-title">Information<br>Technology student.</h1>
    
    <!-- This matches the layout of your Java code -->
    <div class="stat-container">
        <div class="stat-label">2026 — Expected Graduation</div>
    </div>
</section>

<footer>
    © 2026 JANELLA MAE C. MALLARI · GUAGUA, PAMPANGA[cite: 2]
</footer>

<script>
    const cursor = document.getElementById('cursor');
    const ring = document.getElementById('cursorRing');
    
    document.addEventListener('mousemove', (e) => {
        cursor.style.left = e.clientX + 'px';
        cursor.style.top = e.clientY + 'px';
        ring.style.left = (e.clientX - 13) + 'px';
        ring.style.top = (e.clientY - 13) + 'px';
    });
</script>
</body>
</html>
